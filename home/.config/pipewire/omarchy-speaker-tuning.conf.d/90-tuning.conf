# ASUS Vivobook S 16 (S5606MA) speaker tuning.
#
# Not shipped by Omarchy; laid out like its tunings so `omarchy audio tuning
# status|off` and the volume keys treat it the same way.
#
# On Linux the ALC294 drives these slim speakers with no processing at all,
# while Windows runs them through ASUS's audio layer, which keeps bass the
# drivers cannot reproduce away from them and caps peaks. Pushed below their
# usable range the drivers over-excurse and buzz, and that intermodulation is
# heard as rattle and a harsh high-pitched edge on everything, not just bass.
# This chain restores that protection:
#
#   - 4th-order Linkwitz-Riley high-pass at 170 Hz (two Butterworth sections)
#     keeps the low bass the speakers can only distort away from them.
#   - A gentle lift just above the cut-off brings back some warmth the
#     high-pass takes, without reaching back down into the unsafe range.
#   - Small cuts at 450 Hz (chassis boxiness) and 3.2 kHz (shrill presence
#     peak typical of micro speakers) clean up the midrange.
#   - The right driver on this unit buzzes between roughly 300 and 800 Hz
#     (12-40% harmonic distortion against 2% on the left, at any volume), so
#     below 1 kHz both channels are summed to mono and played mainly by the
#     left driver. The right one keeps a quarter of that band and otherwise
#     plays from 1 kHz up, where it is clean. Below 1 kHz there is little
#     stereo to lose on speakers this close together.
#   - A lookahead limiter at -1 dBFS stops peaks from clipping the amplifier
#     at high volume.
#
# Channels are wired explicitly so the stereo limiter sees both sides together.

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Laptop Speakers"
      media.name       = "Laptop Speakers"

      filter.graph = {
        nodes = [
          { type = builtin name = hp1_l    label = bq_highpass  control = { "Freq" = 170.0 "Q" = 0.707 } }
          { type = builtin name = hp2_l    label = bq_highpass  control = { "Freq" = 170.0 "Q" = 0.707 } }
          { type = builtin name = warm_l   label = bq_peaking   control = { "Freq" = 240.0 "Q" = 1.2 "Gain" = 2.0 } }
          { type = builtin name = box_l    label = bq_peaking   control = { "Freq" = 450.0 "Q" = 1.4 "Gain" = -2.5 } }
          { type = builtin name = harsh_l  label = bq_peaking   control = { "Freq" = 3200.0 "Q" = 1.6 "Gain" = -3.0 } }
          { type = builtin name = air_l    label = bq_highshelf control = { "Freq" = 9000.0 "Q" = 0.707 "Gain" = 1.0 } }

          { type = builtin name = hp1_r    label = bq_highpass  control = { "Freq" = 170.0 "Q" = 0.707 } }
          { type = builtin name = hp2_r    label = bq_highpass  control = { "Freq" = 170.0 "Q" = 0.707 } }
          { type = builtin name = warm_r   label = bq_peaking   control = { "Freq" = 240.0 "Q" = 1.2 "Gain" = 2.0 } }
          { type = builtin name = box_r    label = bq_peaking   control = { "Freq" = 450.0 "Q" = 1.4 "Gain" = -2.5 } }
          { type = builtin name = harsh_r  label = bq_peaking   control = { "Freq" = 3200.0 "Q" = 1.6 "Gain" = -3.0 } }
          { type = builtin name = air_r    label = bq_highshelf control = { "Freq" = 9000.0 "Q" = 0.707 "Gain" = 1.0 } }

          # Linkwitz-Riley 1 kHz crossover; low and high halves sum back flat.
          { type = builtin name = xlo1_l   label = bq_lowpass   control = { "Freq" = 1000.0 "Q" = 0.707 } }
          { type = builtin name = xlo2_l   label = bq_lowpass   control = { "Freq" = 1000.0 "Q" = 0.707 } }
          { type = builtin name = xhi1_l   label = bq_highpass  control = { "Freq" = 1000.0 "Q" = 0.707 } }
          { type = builtin name = xhi2_l   label = bq_highpass  control = { "Freq" = 1000.0 "Q" = 0.707 } }
          { type = builtin name = xlo1_r   label = bq_lowpass   control = { "Freq" = 1000.0 "Q" = 0.707 } }
          { type = builtin name = xlo2_r   label = bq_lowpass   control = { "Freq" = 1000.0 "Q" = 0.707 } }
          { type = builtin name = xhi1_r   label = bq_highpass  control = { "Freq" = 1000.0 "Q" = 0.707 } }
          { type = builtin name = xhi2_r   label = bq_highpass  control = { "Freq" = 1000.0 "Q" = 0.707 } }

          { type = builtin name = low_mono label = mixer control = { "Gain 1" = 0.5 "Gain 2" = 0.5 } }
          { type = builtin name = mix_l    label = mixer control = { "Gain 1" = 1.0 "Gain 2" = 1.0 } }
          { type = builtin name = mix_r    label = mixer control = { "Gain 1" = 1.0 "Gain 2" = 0.25 } }

          { type   = lv2
            name   = limiter
            plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = {
              # Both default to enabled and would make the level drift with the
              # programme; a fixed tuning wants neither.
              "alr"   = 0
              "boost" = 0
              # -2 dB in, so the warmth lift cannot push mastered audio into
              # constant limiting.
              "g_in"  = 0.794
              "th"    = 0.891
            }
          }
        ]

        links = [
          { output = "hp1_l:Out"   input = "hp2_l:In" }
          { output = "hp2_l:Out"   input = "warm_l:In" }
          { output = "warm_l:Out"  input = "box_l:In" }
          { output = "box_l:Out"   input = "harsh_l:In" }
          { output = "harsh_l:Out" input = "air_l:In" }
          { output = "air_l:Out"   input = "xlo1_l:In" }
          { output = "air_l:Out"   input = "xhi1_l:In" }
          { output = "hp1_r:Out"   input = "hp2_r:In" }
          { output = "hp2_r:Out"   input = "warm_r:In" }
          { output = "warm_r:Out"  input = "box_r:In" }
          { output = "box_r:Out"   input = "harsh_r:In" }
          { output = "harsh_r:Out" input = "air_r:In" }
          { output = "air_r:Out"   input = "xlo1_r:In" }
          { output = "air_r:Out"   input = "xhi1_r:In" }

          { output = "xlo1_l:Out"  input = "xlo2_l:In" }
          { output = "xhi1_l:Out"  input = "xhi2_l:In" }
          { output = "xlo1_r:Out"  input = "xlo2_r:In" }
          { output = "xhi1_r:Out"  input = "xhi2_r:In" }

          { output = "xlo2_l:Out"   input = "low_mono:In 1" }
          { output = "xlo2_r:Out"   input = "low_mono:In 2" }
          { output = "xhi2_l:Out"   input = "mix_l:In 1" }
          { output = "low_mono:Out" input = "mix_l:In 2" }
          { output = "xhi2_r:Out"   input = "mix_r:In 1" }
          { output = "low_mono:Out" input = "mix_r:In 2" }
          { output = "mix_l:Out"    input = "limiter:in_l" }
          { output = "mix_r:Out"    input = "limiter:in_r" }
        ]

        inputs  = [ "hp1_l:In" "hp1_r:In" ]
        outputs = [ "limiter:out_l" "limiter:out_r" ]
      }

      audio.channels = 2
      audio.position = [ FL FR ]

      capture.props = {
        node.name   = "omarchy_speaker_tuning"
        media.class = Audio/Sink
      }
      playback.props = {
        node.name     = "omarchy_speaker_tuning_output"
        node.passive  = true
        target.object = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink"
        # Keep the processed output pinned to the speakers, and wait for them
        # rather than falling back to whatever else is the default.
        node.dont-move = true
        node.dont-fallback = true
        node.linger = true
      }
    }
  }
]
