# See https://wiki.hyprland.org/Configuring/Monitors/
# List monitors:
# hyprctl monitors all
#
# Format:
# monitor = [port], resolution, position, scale


# ============================================================
# LAPTOP
# 3200x2000 @ 120Hz
# 160% scaling
# ============================================================

monitor=eDP-1,3200x2000@120,0x0,1.4


# ============================================================
# EXTERNAL MONITOR
# 27" 2560x1440 @ 100Hz
# 100% scaling
# Automatically positioned next to laptop
# ============================================================

monitor=HDMI-A-1,2560x1440@100,auto,1
